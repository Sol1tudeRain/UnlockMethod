name: Temporary unsigned v0.4.1 safety hotfix
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/temp-safe-hotfix.yml']
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Export unsigned APK for private signing
        shell: bash
        run: |
          sed -i '/^\/\/ Hard-fail instead of silently/,$d' app/build.gradle
          gradle --no-daemon :app:assembleRelease
          mkdir -p staging
          cp app/build/outputs/apk/release/app-release-unsigned.apk staging/
      - uses: actions/upload-artifact@v4
        with:
          name: UnlockMethod-v0.4.1-unsigned
          path: staging/*.apk
          if-no-files-found: error
