name: Temporary official Android apksigner binary
on:
  push:
    paths: ['.github/workflows/temp-apksigner-tool.yml']
permissions:
  contents: read
jobs:
  apksigner:
    runs-on: ubuntu-latest
    steps:
      - name: Stage official SDK APK signer
        shell: bash
        run: |
          set -euxo pipefail
          find "$ANDROID_HOME/build-tools" -name apksigner.jar -print
          jar="$(find "$ANDROID_HOME/build-tools" -name apksigner.jar | sort -V | tail -n1)"
          if [ -z "$jar" ]; then
            sdkm="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"
            "$sdkm" --sdk_root="$ANDROID_HOME" --install 'build-tools;35.0.0'
            jar="$(find "$ANDROID_HOME/build-tools" -name apksigner.jar | sort -V | tail -n1)"
          fi
          test -f "$jar"
          mkdir output
          cp "$jar" output/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: Official-apksigner-jar
          path: output/apksigner.jar
          if-no-files-found: error
