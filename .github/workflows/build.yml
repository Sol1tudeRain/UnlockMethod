name: Build stable-signed LSPosed APK
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify configured stable-signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.UNLOCK_SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.UNLOCK_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UNLOCK_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UNLOCK_SIGNING_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_B64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Configure all four UNLOCK_SIGNING_* GitHub Actions repository secrets using the PRIVATE signing-setup bundle."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/UnlockMethod-signing.p12"
          echo "UNLOCK_SIGNING_KEYSTORE=$RUNNER_TEMP/UnlockMethod-signing.p12" >> "$GITHUB_ENV"
          echo "UNLOCK_SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "UNLOCK_SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "UNLOCK_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build fixed-signature APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify stable APK signature and fixed certificate identity
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ACTUAL_CERT="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)"
          EXPECTED_CERT="d5c80d09dbb77948e3462d55155af87161f2004b97640e6f8cccf5e30fdea0a4"
          if [[ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]]; then
            echo "::error::APK was signed using the wrong certificate. Do not distribute."
            exit 1
          fi

      - name: Remove private key from runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/UnlockMethod-signing.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: UnlockMethod-stable-signed-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
