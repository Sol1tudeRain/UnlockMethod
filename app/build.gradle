plugins { id 'com.android.application' }

android {
    namespace 'dev.notifingerprint'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.notifingerprint'
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName '0.2.1-aod-test'
    }
    buildTypes {
        debug { }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    // Compile-only Xposed interfaces; these must not be bundled into the APK.
    compileOnly project(':xposed-stubs')
}
