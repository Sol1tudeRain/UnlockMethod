plugins { id 'com.android.application' }

android {
    namespace 'dev.notifingerprint'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.notifingerprint'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1-test'
    }
    buildTypes {
        debug { }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    // Compile-only interfaces; never package these dummy APIs in the APK.
    compileOnly project(':xposed-stubs')
}
